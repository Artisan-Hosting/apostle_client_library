[package]
name = "apostle_client"
version = "1.0.3"
edition = "2024"
authors = [
    "Darrion Whitfield <whitfieldd@artisanhosting.net>"
]
description = "Standalone client for sending mail through the Artisan mail protocol"
homepage = "https://docs.artisanhosting.net"
license = "MIT OR Apache-2.0"

[dependencies]
dusa_collection_utils = "^4.0.2"
colored = "2.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "rt", "sync"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros"], optional = true }
rand = { version = "0.8.5", optional = true }
acai_core = "1.0.0"

[features]
# Server-only surface (the usage ledger: SQLite storage, identity issuance,
# personalized-bundle writing). Off by default so a plain mail-sending client
# build never links sqlx/rand or contains this code path at all.
server-components = ["dep:sqlx", "dep:rand"]

[target.'cfg(target_os = "linux")'.dependencies]
simple_comms = "2.0.1"

[dev-dependencies]
tempfile = "3"
